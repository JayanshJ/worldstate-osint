services:
  # ─── Postgres + pgvector ──────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-worldstate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldstate_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-worldstate}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      # Bind to loopback only — never expose Postgres to the public internet.
      # Inter-service traffic uses the Docker network (host "postgres"); for
      # admin access from a workstation, tunnel over SSH:
      #   ssh -L 5432:127.0.0.1:5432 root@<hetzner-host>
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worldstate}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL:  postgresql+asyncpg://${POSTGRES_USER:-worldstate}:${POSTGRES_PASSWORD:-worldstate_secret}@postgres:5432/${POSTGRES_DB:-worldstate}
      REDIS_URL:     redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      OPENAI_API_KEY:   ${OPENAI_API_KEY}
      GOOGLE_API_KEY:   ${GOOGLE_API_KEY:-}
      FINNHUB_API_KEY:  ${FINNHUB_API_KEY:-}
      RESEND_API_KEY:   ${RESEND_API_KEY:-}
      JWT_SECRET_KEY:   ${JWT_SECRET_KEY}
      ENVIRONMENT:      ${ENVIRONMENT:-production}
      DOMAIN:           ${DOMAIN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"

  # ─── Ingestion Worker ─────────────────────────────────────────────────────
  ingestion_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL:         postgresql+asyncpg://${POSTGRES_USER:-worldstate}:${POSTGRES_PASSWORD:-worldstate_secret}@postgres:5432/${POSTGRES_DB:-worldstate}
      REDIS_URL:            redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      OPENAI_API_KEY:       ${OPENAI_API_KEY}
      TWITTER_BEARER_TOKEN: ${TWITTER_BEARER_TOKEN:-}
      REDDIT_CLIENT_ID:     ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT:    ${REDDIT_USER_AGENT:-WorldState/1.0}
      JWT_SECRET_KEY:       ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - playwright_cache:/root/.cache/ms-playwright
    command: python -m workers.ingestion_runner

  # ─── Clustering + Intelligence Worker ────────────────────────────────────
  cluster_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL:    postgresql+asyncpg://${POSTGRES_USER:-worldstate}:${POSTGRES_PASSWORD:-worldstate_secret}@postgres:5432/${POSTGRES_DB:-worldstate}
      REDIS_URL:       redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      OPENAI_API_KEY:  ${OPENAI_API_KEY}
      GOOGLE_API_KEY:  ${GOOGLE_API_KEY:-}
      RESEND_API_KEY:  ${RESEND_API_KEY:-}
      JWT_SECRET_KEY:  ${JWT_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m workers.cluster_runner

  # ─── Frontend (nginx serving React build) ────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Bind to all interfaces for Tailscale-only access (100.85.93.60:8090).
      # Not reachable from the public internet — Tailscale network only.
      - "0.0.0.0:8090:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ─── Cloudflare Tunnel (public domain access) ──────────────────────────────
  # Outbound-only link to Cloudflare's edge so the site is publicly reachable
  # on your domain WITHOUT router port forwarding. The app itself stays
  # hosted entirely on this box; Cloudflare just proxies visitors in.
  # Dormant until: COMPOSE_PROFILES=tunnel and CLOUDFLARE_TUNNEL_TOKEN are
  # set in .env. Public hostname → service mapping is configured in the
  # Cloudflare Zero Trust dashboard (point it at http://frontend:80).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-placeholder}
    depends_on:
      frontend:
        condition: service_healthy

  # ─── DB Backup (daily pg_dump) ────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-worldstate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worldstate_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-worldstate}
      POSTGRES_HOST:     postgres
      BACKUP_S3_BUCKET:  ${BACKUP_S3_BUCKET:-}
      BACKUP_DIR:        /backups
      RETENTION_DAYS:    "7"
    volumes:
      - ./backend/scripts/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "while true; do sh /backup.sh; sleep 86400; done"

volumes:
  pgdata:
  redisdata:
  playwright_cache:
  backups:
