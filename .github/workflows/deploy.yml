name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need previous commit to detect changed files

      - name: Detect changed services
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          BACKEND=false
          FRONTEND=false

          echo "$CHANGED" | grep -q "^backend/"  && BACKEND=true
          echo "$CHANGED" | grep -q "^frontend/" && FRONTEND=true

          # If workflow or compose config changed, rebuild everything
          echo "$CHANGED" | grep -q "^\.github/" && BACKEND=true && FRONTEND=true
          echo "$CHANGED" | grep -q "^docker-compose" && BACKEND=true && FRONTEND=true

          echo "backend=$BACKEND"   >> $GITHUB_OUTPUT
          echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: root
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          envs:     GH_TOKEN
          script: |
            set -e
            cd ~/worldstate-osint

            # Pull using token so no interactive credentials needed.
            # Use fetch + reset --hard so local server changes never block a deploy.
            git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/JayanshJ/worldstate-osint.git
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin https://github.com/JayanshJ/worldstate-osint.git

            BACKEND="${{ steps.changes.outputs.backend }}"
            FRONTEND="${{ steps.changes.outputs.frontend }}"

            if [ "$BACKEND" = "true" ] && [ "$FRONTEND" = "true" ]; then
              echo "==> Rebuilding backend + frontend"
              docker compose build api frontend
              docker compose up -d api frontend
            elif [ "$BACKEND" = "true" ]; then
              echo "==> Rebuilding backend only"
              docker compose build api
              docker compose up -d api
            elif [ "$FRONTEND" = "true" ]; then
              echo "==> Rebuilding frontend only"
              docker compose build frontend
              docker compose up -d frontend
            else
              echo "==> No service changes detected — skipping rebuild"
            fi

            docker compose ps
